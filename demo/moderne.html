
<!-- 4. Moderne detaljer: myk sideovergang, bilder som tones inn, toppmeny med skygge, lenker som tegnes,
        kopier varenummer, lasteskjelett i katalogene, lesefremdrift på artikler og «til toppen»-knapp.
        Alt skrus av for besøkende som har bedt om mindre bevegelse (unntatt kopiering og til toppen). -->
<style>
  /* 1. Myk overgang mellom sider (Chrome, Edge, Safari – andre nettlesere bytter side som før) */
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .28s; animation-timing-function: ease; }
  /* 2. Bilder tones inn */
  .ftx-fi { opacity: 0; transition: opacity .55s ease; }
  .ftx-fi.ftx-fi-in { opacity: 1; }
  /* 3. Toppmeny med skygge og lett gjennomsiktig bakgrunn når man har scrollet */
  #header .header-background-solid { transition: background-color .3s, box-shadow .3s, backdrop-filter .3s; }
  html.ftx-scrolled #header .header-background-solid { background-color: rgba(255, 255, 255, .86) !important; -webkit-backdrop-filter: saturate(160%) blur(12px); backdrop-filter: saturate(160%) blur(12px); box-shadow: 0 10px 28px -18px rgba(5, 43, 105, .45); }
  /* 4. Lenker der streken tegnes fra venstre (blå → oransje) */
  #ftx a.ftx-more, #ftx a.ftx-cross, #ftx .gaa > span { border-bottom-color: transparent !important; text-decoration: none; background: linear-gradient(#f07d00, #f07d00) 0 100% / 0 2px no-repeat, linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat; transition: background-size .35s cubic-bezier(.2, .7, .2, 1); padding-bottom: 2px; }
  #ftx a.ftx-more:hover, #ftx a.ftx-cross:hover, #ftx a:hover .gaa > span, #ftx a.ftx-more:focus-visible, #ftx a.ftx-cross:focus-visible { background-size: 100% 2px, 100% 1px; }
  #ftx p a:not([class]), #ftx li a:not([class]), #ftx .ftx-note a, #ftx .ftx-docnote a { text-decoration: none; background: linear-gradient(#f07d00, #f07d00) 0 100% / 0 2px no-repeat, linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat; transition: background-size .35s cubic-bezier(.2, .7, .2, 1); }
  #ftx p a:not([class]):hover, #ftx li a:not([class]):hover, #ftx .ftx-note a:hover, #ftx .ftx-docnote a:hover { background-size: 100% 2px, 100% 1px; }
  /* 5. Kopier varenummer */
  .ftx-kopi { cursor: copy; border-radius: 3px; transition: background-color .2s, color .2s; }
  .ftx-kopi:hover { background-color: #fff1e3; color: #b65a00 !important; }
  .ftx-toast { position: fixed; left: 50%; bottom: 28px; z-index: 100001; transform: translate(-50%, 16px); opacity: 0; background: #052b69; color: #fff; font: 600 14.5px/1.3 "Barlow", system-ui, sans-serif; padding: 11px 18px; border-radius: 999px; box-shadow: 0 14px 30px -14px rgba(3, 22, 56, .6); transition: opacity .25s, transform .25s; pointer-events: none; }
  .ftx-toast.vis { opacity: 1; transform: translate(-50%, 0); }
  /* 6. Lasteskjelett i katalogene */
  .ftx-skel { display: grid; gap: 10px; margin: 6px 0 24px; }
  .ftx-skel i { display: block; height: 58px; border-radius: 10px; background: linear-gradient(90deg, #eef1f6 0%, #f7f9fc 40%, #eef1f6 80%); background-size: 200% 100%; animation: ftx-skel 1.3s ease-in-out infinite; }
  .ftx-skel i:nth-child(odd) { width: 96%; } .ftx-skel i:nth-child(3n) { width: 88%; }
  @keyframes ftx-skel { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  /* 7. Lesefremdrift på artikler */
  .ftx-progress { position: fixed; left: 0; top: 0; z-index: 100002; height: 3px; width: 100%; background: #f07d00; transform-origin: 0 50%; transform: scaleX(0); pointer-events: none; }
  /* 8. Til toppen */
  .ftx-totop { position: fixed; right: 20px; bottom: 22px; z-index: 9990; width: 46px; height: 46px; border-radius: 50%; border: 1px solid #d6dbe2; background: #fff; color: #052b69; display: grid; place-items: center; cursor: pointer; box-shadow: 0 12px 26px -14px rgba(3, 22, 56, .55); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .25s, transform .25s, border-color .2s; }
  .ftx-totop.vis { opacity: 1; transform: none; pointer-events: auto; }
  .ftx-totop:hover { border-color: #052b69; }
  .ftx-totop svg { width: 20px; height: 20px; }
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
    .ftx-fi { opacity: 1; transition: none; }
    .ftx-skel i { animation: none; }
    #ftx a.ftx-more, #ftx a.ftx-cross, #ftx .gaa > span, #ftx p a:not([class]), #ftx li a:not([class]) { transition: none; }
    .ftx-progress { display: none; }
  }
  @media print { .ftx-totop, .ftx-progress, .ftx-toast { display: none !important; } .ftx-fi { opacity: 1 !important; } }
</style>
<script>
(function () {
  if (window.top !== window || window.__ftModerne) return;
  window.__ftModerne = true;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 2. Bilder tones inn – bare bilder som ikke er lastet ennå */
  function fi(img) {
    if (reduce || img.__ftFi || img.closest('header, .fts-ov, .fts-dd')) return;
    img.__ftFi = true;
    if (img.complete && img.naturalWidth) return;
    img.classList.add('ftx-fi');
    var done = function () { img.classList.add('ftx-fi-in'); setTimeout(function () { img.classList.remove('ftx-fi', 'ftx-fi-in'); }, 700); };
    img.addEventListener('load', done, { once: true });
    img.addEventListener('error', done, { once: true });
    setTimeout(done, 5000);   // aldri usynlig
  }
  function scanImgs(root) { [].forEach.call((root || document).querySelectorAll('#ftx img, article img, .blog-item-content img'), fi); }

  /* 5. Kopier varenummer (UTB-, Perma- og Vickers-emballasje, Perma-tabellene og LE-produktnumre) */
  var KOPI = '#ftx .ftx-pack small, #ftx table.ftx-mxt td.n, #ftx .ftx-sku';
  function markKopi(root) {
    [].forEach.call((root || document).querySelectorAll(KOPI), function (el) {
      if (el.classList.contains('ftx-kopi')) return;
      el.classList.add('ftx-kopi'); el.setAttribute('title', 'Klikk for å kopiere');
    });
  }
  var toast;
  function vis(msg) {
    if (!toast) { toast = document.createElement('div'); toast.className = 'ftx-toast'; toast.setAttribute('role', 'status'); toast.setAttribute('aria-live', 'polite'); document.body.appendChild(toast); }
    toast.textContent = msg; toast.classList.add('vis');
    clearTimeout(toast.__t); toast.__t = setTimeout(function () { toast.classList.remove('vis'); }, 1800);
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('.ftx-kopi'); if (!el) return;
    var txt = (el.firstChild && el.firstChild.nodeType === 3 ? el.firstChild.textContent : el.textContent).trim();
    if (!txt) return;
    e.preventDefault(); e.stopPropagation();
    var ok = function () { vis('Kopiert ' + txt); }, fb = function () {
      var t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (x) {} t.remove();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
  }, true);

  /* 6. Lasteskjelett mens katalogene henter produktene */
  function skjelett() {
    var cnt = document.getElementById('ftx-count'), body = document.getElementById('ftx-tbody');
    if (!cnt || !body || body.children.length || !/^Laster/.test(cnt.textContent)) return;
    var sk = document.createElement('div'); sk.className = 'ftx-skel'; sk.setAttribute('aria-hidden', 'true');
    sk.innerHTML = new Array(9).join('<i></i>');
    cnt.parentNode.insertBefore(sk, cnt.nextSibling);
    var stop = function () { if (sk.parentNode) sk.remove(); mo.disconnect(); };
    var mo = new MutationObserver(function () { if (body.children.length || !/^Laster/.test(cnt.textContent)) stop(); });
    mo.observe(body, { childList: true }); mo.observe(cnt, { childList: true, characterData: true, subtree: true });
    setTimeout(stop, 20000);
  }

  /* 3, 7 og 8: toppmeny, lesefremdrift og «til toppen» – oppdateres samlet ved scrolling */
  var artikkel = /^\/artikler\/.+/.test(location.pathname), bar = null, top = null, ticking = false;
  if (artikkel && !reduce) { bar = document.createElement('div'); bar.className = 'ftx-progress'; bar.setAttribute('aria-hidden', 'true'); document.body.appendChild(bar); }
  function lagTop() {
    top = document.createElement('button'); top.type = 'button'; top.className = 'ftx-totop'; top.setAttribute('aria-label', 'Til toppen av siden');
    top.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); });
    document.body.appendChild(top);
  }
  function onScroll() {
    ticking = false;
    var y = window.scrollY || document.documentElement.scrollTop, h = document.documentElement.scrollHeight - window.innerHeight;
    document.documentElement.classList.toggle('ftx-scrolled', y > 40);
    if (bar) bar.style.transform = 'scaleX(' + (h > 0 ? Math.min(1, y / h) : 0) + ')';
    if (h > window.innerHeight * 2) { if (!top) lagTop(); top.classList.toggle('vis', y > window.innerHeight * 1.2); }
  }
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  window.addEventListener('resize', onScroll);

  function start() {
    scanImgs(); markKopi(); skjelett(); onScroll();
    var root = document.getElementById('ftx');
    if (root) new MutationObserver(function (list) {
      list.forEach(function (m) { [].forEach.call(m.addedNodes, function (n) { if (n.nodeType !== 1) return; if (n.tagName === 'IMG') fi(n); else scanImgs(n); markKopi(n.parentNode || n); }); });
    }).observe(root, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  window.addEventListener('load', onScroll);
})();
</script>
